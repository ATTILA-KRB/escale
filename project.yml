name: Escale
options:
  bundleIdPrefix: com.attila-krb
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  EscaleCore:
    path: Packages/EscaleCore
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.3
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  Escale:
    type: application
    platform: macOS
    sources: [Escale]
    dependencies:
      - package: EscaleCore
      - package: SwiftTerm
    info:
      path: Escale/Info.plist
      properties:
        CFBundleDisplayName: Escale
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.attila-krb.Escale
        PRODUCT_NAME: Escale
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Escale:
    build:
      targets:
        Escale: all
