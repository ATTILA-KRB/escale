name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste passwords, private keys or real server addresses you want to keep private.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a session on ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Escale version
      description: "Escale > About Escale (or the commit if built from source)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac (Apple silicon / Intel)
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server side (OS, OpenSSH version, jump host?)
  - type: textarea
    id: logs
    attributes:
      label: Output of `ssh -V` and relevant messages
      render: shell
